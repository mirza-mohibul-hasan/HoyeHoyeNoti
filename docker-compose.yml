services:
  backend:
    build:
      context: ./backend-noti
    ports:
      - "8000:8000"
    volumes:
      - ./backend-noti:/app
      - backend-venv:/app/.venv

  frontend:
    build:
      context: ./frontend-noti
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend-noti:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    # Turbopack's native file watcher doesn't see changes through the Windows
    # host -> container bind mount, so dev falls back to webpack here, whose
    # watcher respects WATCHPACK_POLLING for reliable hot-reload in Docker.
    command: pnpm exec next dev --webpack -p 3000 -H 0.0.0.0

volumes:
  backend-venv:
  frontend-node-modules:
  frontend-next-cache:
